name: cache-clean

on:
  schedule:
    # 每周一 04:00（北京时间）
    - cron: 0 20 * * 0
  workflow_dispatch:

permissions:
  actions: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: 回收编译缓存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 200 --json id,key \
            --jq '.[] | [.id, .key] | @tsv' | while IFS=$'\t' read -r id key; do
              # 全量回收：基线快照变动后旧缓存只会污染下一次构建
              echo "delete cache: $key"
              gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
            done
